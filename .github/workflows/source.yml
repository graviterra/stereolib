name: Source checks (no Lean build)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B tools/check_source_tree.py
      - run: python3 -B -m unittest discover -s tests
